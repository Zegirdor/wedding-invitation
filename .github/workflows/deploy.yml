name: Wedding Invitation's Build on GitHub Pages or Self-hosted runner, then deploy on both
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-deploy
  cancel-in-progress: false

jobs:
  build-on-github:
    name: Build on GitHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build -- --base=./

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: wedding-invitation-pages-artifact
          path: dist/
          
      - name: Upload artifact for homeserver deployment
        uses: actions/upload-artifact@v7
        with:
          name: wedding-invitation-homeserver-artifact
          path: dist/
          if-no-files-found: error
  
  build-on-homeserver:
    name: Build on Homeserver
    runs-on: self-hosted
    needs: build-on-github
    if: failure() && needs.build-on-github.result == 'failure' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build -- --base=./

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: wedding-invitation-pages-artifact-fallback
          path: dist/
          
      - name: Upload artifact for homeserver deployment
        uses: actions/upload-artifact@v7
        with:
          name: wedding-invitation-homeserver-artifact-fallback
          path: dist/
          if-no-files-found: error

  deploy-on-github-pages:
    name: Deploy to GitHub Pages
    needs: [build-on-github, build-on-homeserver]
    if: >-
      always() && (needs.build-on-github.result == 'success' || needs.build-on-homeserver.result == 'success') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: GitHub Pages deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build-on-github.result == 'success' && 'wedding-invitation-pages-artifact' || 'wedding-invitation-pages-artifact-fallback' }}

  deploy-homeserver:
    name: Deploy to homeserver
    needs: [build-on-github, build-on-homeserver]
    if: >-
      always() && (needs.build-on-github.result == 'success' || needs.build-on-homeserver.result == 'success') && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Download regular artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-on-github.result == 'success' && 'wedding-invitation-homeserver-artifact' || 'wedding-invitation-homeserver-artifact-fallback' }}
          path: dist/

      - name: Publish site to Nginx directory
        run: |
          find /var/www/nodejs/wedding-invitation -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /var/www/nodejs/wedding-invitation/