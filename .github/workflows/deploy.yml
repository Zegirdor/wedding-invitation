name: Deploy to GitHub Pages and Homeserver

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  Deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  server-build:
    name: Build on homeserver
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site for deployment
        uses: actions/upload-artifact@v7
        with:
          name: homeserver-site
          path: dist/
          if-no-files-found: error

  deploy-homeserver:
    name: Deploy to homeserver
    runs-on: self-hosted
    needs: server-build
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: homeserver-site
          path: dist/

      - name: Publish site to Nginx directory
        run: |
          find /var/www/nodejs/wedding-invitation -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /var/www/nodejs/wedding-invitation/
